name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3'
      - run: python -m pip install -r ./requirements.txt
      - run: python ./generate.py
      - run: python ./test.py
      - run: bash ./check.bash
